<VirtualHost *:80>
    # Change these to match your domain or public IP
    ServerName 13.201.86.151
    

    # Point to your application directory
    DocumentRoot /var/www/html/cryptopix-bridge

    # Update path to your project directory
    WSGIDaemonProcess cryptopixbridge python-home=/var/www/html/cryptopix-bridge/venv python-path=/var/www/html/cryptopix-bridge
    WSGIProcessGroup cryptopixbridge
    WSGIApplicationGroup %{GLOBAL}

    # Point to the WSGI script
    WSGIScriptAlias / /var/www/html/cryptopix-bridge/deploy/cryptopix.wsgi

    <Directory /var/www/html/cryptopix-bridge>
        Require all granted
    </Directory>

    <Directory /var/www/html/cryptopix-bridge/deploy>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cryptopix-error.log
    CustomLog ${APACHE_LOG_DIR}/cryptopix-access.log combined
</VirtualHost>
