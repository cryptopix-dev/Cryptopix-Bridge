<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CryptopixBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>CryptopixBridge</h1>
        </div>
    </header>

    <div class="main-container">
        <div class="login-content">
            <div class="logo">
                <h1><i class="bi bi-shield-lock-fill me-2"></i>CryptopixBridge</h1>
                <p>Secure Database Encryption Platform</p>
            </div>

            <!-- Toast container -->
            <div class="toast-container" id="toastContainer"></div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <script>
                            // Check if it's a logout success message
                            var messageText = '{{ message }}';
                            if (messageText.toLowerCase().includes('logged out')) {
                                showToast(messageText, 'success');
                            } else {
                                showToast(messageText, 'error');
                            }
                        </script>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form id="loginForm" method="POST" action="{{ url_for('login') }}">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="user@company.com" required>
                    <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="text" class="form-control" id="license_key" name="license_key" placeholder="CPIX-A1B2-C3D4-E5F6-G7H8" required>
                    <label for="license_key"><i class="bi bi-key me-2"></i>License Key</label>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Login</span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        form.addEventListener('submit', function(e) {
            loginBtn.disabled = true;
            btnText.innerHTML = '<span class="loading me-1"></span>Authenticating...';
        });

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            toast.innerHTML = `
                <div class="toast-body">
                    <strong>${type.charAt(0).toUpperCase() + type.slice(1)}:</strong> ${message}
                </div>
            `;

            toastContainer.appendChild(toast);

            // Initialize Bootstrap toast with 8-second delay
            const bsToast = new bootstrap.Toast(toast, {
                autohide: true,
                delay: 8000
            });
            bsToast.show();

            // Remove from DOM after hiding
            toast.addEventListener('hidden.bs.toast', () => {
                toast.remove();
            });
        }
    </script>
</body>
</html>
